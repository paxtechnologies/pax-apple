# SPDX-License-Identifier: GPL-3.0-only
# Pax for iPhone and iPad: write the App Store listing for version 1.2.0 from pax-ios/appstore/
# (text, screenshots, review notes, build) with the App Store Connect API, then read it all back.
# mode=apply|read never submit. mode=submit (ci/asc_submit.py) checks the listing and build, then
# sends the version to App Review, released automatically once approved. Runs only on
# ios/onetap-v1.2, when a push changes pax-ios/appstore-metadata.txt (mode=apply|read|submit,
# other_sets=keep|clear).
# Uses the same repo secret as ios-upload: ASC_KEY_P8 (key ID and issuer ID are not secret).
name: ios-metadata
on:
  push:
    branches: [ios/onetap-v1.2]
    paths: ['pax-ios/appstore-metadata.txt']
permissions:
  contents: read
concurrency:
  group: ios-metadata
  cancel-in-progress: false
jobs:
  metadata:
    if: github.ref == 'refs/heads/ios/onetap-v1.2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pax-ios
    env:
      ASC_KEY_ID: 8G4S3TUCV5
      ASC_ISSUER_ID: a8055883-0c57-4d82-ae26-a8b35e6f087d
      APP_ID: '6825390558'
      VERSION: 1.2.0
      BUILD: '6'
    steps:
      - uses: actions/checkout@v4
      - name: Write the API key (temp, deleted at the end)
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set +x
          umask 077
          [ -n "$ASC_KEY_P8" ] || { echo "::error::Missing repository secret ASC_KEY_P8"; exit 1; }
          mkdir -p "$RUNNER_TEMP/asc"
          echo "KEY=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
          OUT="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" python3 - <<'PY'
          import os, re, base64, binascii
          raw = os.environ["ASC_KEY_P8"]
          s = raw.strip().strip('"').strip("'").replace("\\r\\n", "\n").replace("\\n", "\n").replace("\r", "")
          if "BEGIN PRIVATE KEY" not in s:
              compact = re.sub(r"\s+", "", s)
              try:
                  dec = base64.b64decode(compact + "=" * (-len(compact) % 4), validate=False)
              except (binascii.Error, ValueError):
                  dec = b""
              if b"BEGIN PRIVATE KEY" in dec:
                  s = dec.decode("ascii", "ignore").replace("\r", "").strip()
              elif dec[:1] == b"\x30" and len(dec) > 100:
                  s = "-----BEGIN PRIVATE KEY-----\n" + compact + "\n-----END PRIVATE KEY-----"
              else:
                  print("::error::ASC_KEY_P8 isn't a .p8 key in any known form"); raise SystemExit(1)
          m = re.search(r"-----BEGIN PRIVATE KEY-----(.*?)-----END PRIVATE KEY-----", s, re.S)
          if not m:
              print("::error::ASC_KEY_P8 has no END PRIVATE KEY line"); raise SystemExit(1)
          body = re.sub(r"\s+", "", m.group(1))
          open(os.environ["OUT"], "w").write("-----BEGIN PRIVATE KEY-----\n" + "\n".join(body[i:i + 64] for i in range(0, len(body), 64)) + "\n-----END PRIVATE KEY-----\n")
          PY
          openssl pkey -in "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" -noout && echo "key parses"
      - name: Write the listing and read it back
        run: |
          set +x
          export MODE=$(sed -n 's/^mode=//p' appstore-metadata.txt | tr -d ' \r')
          export OTHER_SETS=$(sed -n 's/^other_sets=//p' appstore-metadata.txt | tr -d ' \r')
          if [ "$MODE" = "submit" ]; then python3 -u ci/asc_submit.py; else python3 ci/asc_metadata.py; fi
      - name: Delete the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc" && echo "key files removed"
