# SPDX-License-Identifier: GPL-3.0-only
# Pax for iPhone and iPad (pax-ios/): generate the Xcode project with XcodeGen, build every
# target for the simulator without signing, and run the unit tests. No secrets, no release.
name: ios
on:
  push:
    paths: ['pax-ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['pax-ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: pax-ios
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Pax.xcodeproj -scheme Pax -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Unit tests
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in sorted(d.items(),reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild -project Pax.xcodeproj -scheme Pax -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: ${{ runner.temp }}/*.log
