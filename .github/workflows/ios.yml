# SPDX-License-Identifier: GPL-3.0-only
# Pax for iPhone and iPad (pax-ios/ and the interim guide app, pax-ios/Guide/): generate the Xcode project with XcodeGen, build every
# target for the simulator without signing, and run the unit tests. No secrets, no release.
name: ios
on:
  push:
    paths: ['pax-ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['pax-ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: pax-ios
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Pax.xcodeproj -scheme Pax -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Unit tests
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in sorted(d.items(),reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild -project Pax.xcodeproj -scheme Pax -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: ${{ runner.temp }}/*.log

  # The interim guide app (pax-ios/Guide): no entitlements, ships first under the same
  # bundle id. Build for the simulator, run its tests, and keep a few screenshots.
  guide:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: pax-ios/Guide
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project PaxGuide.xcodeproj -scheme Pax -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/guide-build.log"
      - name: Unit tests
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in sorted(d.items(),reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "IPHONE_UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild -project PaxGuide.xcodeproj -scheme Pax -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/guide-test.log"
      - name: Screenshots (simulator)
        continue-on-error: true
        run: |
          set -x
          mkdir -p "$RUNNER_TEMP/shots"
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -path '*iphonesimulator*' -name 'Pax.app' | head -1)
          shoot() {  # udid name args...
            local U=$1 N=$2; shift 2
            xcrun simctl terminate "$U" org.paxpeace.pax || true
            xcrun simctl launch "$U" org.paxpeace.pax "$@"
            sleep 9
            xcrun simctl io "$U" screenshot "$RUNNER_TEMP/shots/$N.png"
          }
          U=$IPHONE_UDID
          xcrun simctl boot "$U" || true
          xcrun simctl bootstatus "$U" -b
          xcrun simctl status_bar "$U" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$U" "$APP"
          xcrun simctl ui "$U" appearance light
          shoot "$U" iphone-1-top
          shoot "$U" iphone-2-steps -PaxScrollToStep 3
          shoot "$U" iphone-3-check -PaxScrollToStep 7 -PaxRunCheck
          xcrun simctl ui "$U" appearance dark
          shoot "$U" iphone-4-dark
          shoot "$U" iphone-5-dark-check -PaxScrollToStep 7 -PaxRunCheck
          # iPad: the same simulator build runs on an iPad simulator.
          P=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in sorted(d.items(),reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPad')))")
          xcrun simctl boot "$P" || true
          xcrun simctl bootstatus "$P" -b
          xcrun simctl status_bar "$P" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$P" "$APP"
          xcrun simctl ui "$P" appearance light
          shoot "$P" ipad-1-top
          ls -la "$RUNNER_TEMP/shots"
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guide-screenshots
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: ignore
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guide-logs
          path: ${{ runner.temp }}/guide-*.log
