# SPDX-License-Identifier: GPL-3.0-only
# Pax for iPhone and iPad (pax-ios/ and the interim guide app, pax-ios/Guide/): generate the Xcode project with XcodeGen, build every
# target for the simulator without signing, and run the unit tests. No secrets, no release.
name: ios
on:
  push:
    paths: ['pax-ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['pax-ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15-intel   # arm64 macOS runners were out of capacity on 2026-10-20
    timeout-minutes: 40
    defaults:
      run:
        working-directory: pax-ios
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Pax.xcodeproj -scheme Pax -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Unit tests
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in sorted(d.items(),reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "IPHONE_UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild -project Pax.xcodeproj -scheme Pax -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: ${{ runner.temp }}/*.log

  # App Store screenshots (Debug build, simulator): 6.9" iPhone (1320x2868) and 13" iPad
  # (2064x2752). Non-blocking: a slow or hung simulator boot never turns the workflow red.
  # Screens are opened with Debug-only launch arguments (pax-ios/App/ScreenshotMode.swift).
  appstore-screenshots:
    runs-on: macos-15-intel   # arm64 macOS runners were out of capacity on 2026-10-20
    timeout-minutes: 75
    continue-on-error: true
    defaults:
      run:
        working-directory: pax-ios
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build for the simulator (Debug, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Pax.xcodeproj -scheme Pax -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/shots-build.log"
      - name: List simulators
        run: xcrun simctl list devices available
      - name: Screenshots
        timeout-minutes: 55
        run: |
          set -x
          mkdir -p "$RUNNER_TEMP/shots"
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -path '*iphonesimulator*' -name 'Pax.app' | head -1)
          pick() {  # newest iOS runtime, first device whose name contains $1
            xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          for k,v in sorted(d.items(), reverse=True):
              if 'iOS' not in k: continue
              for x in v:
                  if sys.argv[1] in x['name']: print(x['udid']); sys.exit()
          " "$1"
          }
          size() { stat -f%z "$1" 2>/dev/null || echo 0; }
          # A frame caught before SwiftUI draws is only the launch colour: it compresses to
          # ~90-120 KB, while real screens are 250 KB+. Retry those (up to 3 launches, longer
          # waits each time) instead of keeping a blank image.
          shoot() {  # udid prefix name launch-args...
            local U=$1 P=$2 N=$3; shift 3
            local F="$RUNNER_TEMP/shots/$P-$N.png" try look
            for try in 1 2 3; do
              xcrun simctl launch --terminate-running-process "$U" org.paxpeace.pax "$@" || { sleep 10; continue; }
              for look in 1 2 3; do
                sleep $((8 + try * 6))
                xcrun simctl io "$U" screenshot "$F" || true
                [ "$(size "$F")" -gt 200000 ] && return 0
              done
              echo "::warning::$P-$N looked blank ($(size "$F") bytes) after launch $try"
              xcrun simctl spawn "$U" log show --last 2m --style compact --predicate 'process == "Pax"' 2>/dev/null | tail -15 || true
            done
            echo "::warning::$P-$N stayed blank; dropped"; rm -f "$F"
          }
          device() {  # udid prefix
            local U=$1 P=$2
            [ -n "$U" ] || { echo "no simulator for $P"; return 0; }
            xcrun simctl boot "$U" || true
            # Cold boots on the Intel runner can take many minutes: wait up to 20.
            if ! perl -e 'alarm shift; exec @ARGV' 1200 xcrun simctl bootstatus "$U" -b; then   # macOS has no timeout(1)
              echo "::warning::$P simulator did not finish booting"; xcrun simctl shutdown "$U" || true; return 0
            fi
            sleep 20
            xcrun simctl status_bar "$U" override --time 9:41 --dataNetwork wifi --wifiBars 3 \
              --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100 || true
            xcrun simctl install "$U" "$APP" || return 0
            xcrun simctl ui "$U" appearance light
            shoot "$U" "$P" 1-welcome
            shoot "$U" "$P" 2-home -PaxShotHome YES
            shoot "$U" "$P" 3-done -PaxShotStep 7
            shoot "$U" "$P" 4-child -PaxShotStep 1
            xcrun simctl ui "$U" appearance dark
            shoot "$U" "$P" 5-home-dark -PaxShotHome YES
            xcrun simctl shutdown "$U" || true
          }
          device "$(pick 'Pro Max')" iphone69
          IPAD=$(pick 'iPad Pro 13-inch'); [ -n "$IPAD" ] || IPAD=$(pick '13-inch')   # iPad Pro 13" = 2064x2752
          device "$IPAD" ipad13
          for f in "$RUNNER_TEMP"/shots/*.png; do sips -g pixelWidth -g pixelHeight "$f"; done
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appstore-screenshots
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: ignore
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appstore-screenshots-logs
          path: ${{ runner.temp }}/shots-*.log

  # The interim guide app (pax-ios/Guide): no entitlements, ships first under the same
  # bundle id. Build for the simulator, run its tests, and keep a few screenshots.
  guide:
    runs-on: macos-15-intel   # arm64 macOS runners were out of capacity on 2026-10-20
    timeout-minutes: 40
    defaults:
      run:
        working-directory: pax-ios/Guide
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project PaxGuide.xcodeproj -scheme Pax -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/guide-build.log"
      - name: Unit tests
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in sorted(d.items(),reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "IPHONE_UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild -project PaxGuide.xcodeproj -scheme Pax -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/guide-test.log"
      - name: Screenshots (simulator)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          set -x
          mkdir -p "$RUNNER_TEMP/shots"
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -path '*iphonesimulator*' -name 'Pax.app' | head -1)
          shoot() {  # udid name args...
            local U=$1 N=$2; shift 2
            xcrun simctl launch --terminate-running-process "$U" org.paxpeace.pax "$@"
            sleep 9
            xcrun simctl io "$U" screenshot "$RUNNER_TEMP/shots/$N.png"
          }
          U=$IPHONE_UDID
          xcrun simctl boot "$U" || true
          xcrun simctl bootstatus "$U" -b
          xcrun simctl status_bar "$U" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$U" "$APP"
          xcrun simctl ui "$U" appearance light
          shoot "$U" iphone-1-top
          shoot "$U" iphone-2-steps -PaxScrollToStep 3
          shoot "$U" iphone-3-check -PaxScrollToStep 7 -PaxRunCheck
          xcrun simctl ui "$U" appearance dark
          shoot "$U" iphone-4-dark
          shoot "$U" iphone-5-dark-check -PaxScrollToStep 7 -PaxRunCheck
          # No iPad shot: a cold iPad simulator boot hung the step on the runner (2026-10-20).
          ls -la "$RUNNER_TEMP/shots"
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guide-screenshots
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: ignore
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guide-logs
          path: ${{ runner.temp }}/guide-*.log
